apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerce
resources: [../../base]
images:
  - { name: ghcr.io/ericguerra/store-revenue, newTag: "1.0.0-rc.3" }
patches:
  - target: { kind: ScaledObject, name: store-revenue }
    patch: |-
      - { op: replace, path: /spec/minReplicaCount, value: 1 }
      - { op: replace, path: /spec/maxReplicaCount, value: 3 }
  - target: { kind: Deployment, name: store-revenue }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
